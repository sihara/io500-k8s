apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: io500-sc
provisioner: exa.csi.ddn.com
allowedTopologies:
- matchLabelExpressions:
  - key: topology.exa.csi.ddn.com/zone
    values:
    - zone-1
allowVolumeExpansion: true
parameters:
  exaMountUid: "1001"
  exaFS: "<MGS-NID-1>:<MGS-NID-2>:/<fsname>/<subdir>"   # e.g. "192.0.2.10@o2ib:192.0.2.11@o2ib:/exafs/k8s"
  mountPoint: "/exafs"
  bindMount: "false"
